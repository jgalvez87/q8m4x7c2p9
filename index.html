<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zelda 40 Aniversario — Conciertos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
body{background:#f8f6f0;min-height:100vh}
.hero{background:linear-gradient(135deg,#7c2d12,#b45309 55%,#d97706);color:white;padding:18px 0}
.city-card{border-radius:16px;border:1px solid #e7e0d0;background:white;transition:.15s}
.city-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(120,80,20,.10)}
.kpi{border-radius:14px;border:1px solid #e7e0d0;background:white}
.kpi .num{font-weight:800;font-size:1.45rem;letter-spacing:-.02em}
.badge-venta{background:#dcfce7;color:#14532d}
.badge-agotado{background:#fee2e2;color:#7f1d1d}
.badge-prox{background:#fef3c7;color:#78350f}
.fila-fecha{border-bottom:1px dashed #eee6d5}
.fila-fecha:last-child{border-bottom:0}
.cambio-item{border-left:3px solid #b45309;background:#fffbeb}
.historial-box{max-height:340px;overflow:auto}
@media(max-width:576px){.kpi .num{font-size:1.2rem}}
</style>
</head>
<body>
<div class="hero">
  <div class="container d-flex justify-content-between align-items-center">
    <div>
      <h4 class="mb-1"><i class="fa-solid fa-music me-2"></i>Zelda 40 Aniversario</h4>
      <small class="opacity-75">Gira mundial 2027 · actualizado cada 5 min</small>
    </div>
    <span class="badge bg-white text-dark" id="badge-update">--</span>
  </div>
</div>

<div class="container py-4">
  <div class="row g-3 mb-4" id="kpis">
    <div class="col-6 col-md-3"><div class="kpi p-3"><div class="text-muted small">Ciudades</div><div class="num" id="kpiCiudades">--</div></div></div>
    <div class="col-6 col-md-3"><div class="kpi p-3"><div class="text-muted small">Conciertos</div><div class="num" id="kpiTotal">--</div></div></div>
    <div class="col-6 col-md-3"><div class="kpi p-3" style="border-left:4px solid #16a34a"><div class="text-muted small">A la venta</div><div class="num text-success" id="kpiVenta">--</div></div></div>
    <div class="col-6 col-md-3"><div class="kpi p-3" style="border-left:4px solid #dc2626"><div class="text-muted small">Agotados</div><div class="num text-danger" id="kpiAgotado">--</div></div></div>
  </div>

  <!-- Panel últimos cambios -->
  <div class="card border-0 shadow-sm mb-4" style="border-radius:16px">
    <div class="card-body py-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="mb-0"><i class="fa-solid fa-clock-rotate-left me-2 text-warning"></i>Últimos cambios detectados</h6>
        <button class="btn btn-sm btn-outline-secondary" id="btnRefresh"><i class="fa-solid fa-rotate me-1"></i>Actualizar</button>
      </div>
      <div class="historial-box" id="historialBox"><span class="text-muted small">Cargando...</span></div>
    </div>
  </div>

  <div class="d-flex flex-wrap gap-2 mb-3 align-items-center">
    <div class="btn-group" role="group">
      <button class="btn btn-sm btn-dark filtro" data-f="todos">Todos</button>
      <button class="btn btn-sm btn-outline-dark filtro" data-f="en_venta">A la venta</button>
      <button class="btn btn-sm btn-outline-dark filtro" data-f="proximamente">Próx. venta</button>
      <button class="btn btn-sm btn-outline-dark filtro" data-f="agotado">Agotados</button>
    </div>
    <a class="btn btn-sm btn-warning" href="https://zelda.gameconcerts.com/" target="_blank"><i class="fa-solid fa-up-right-from-square me-1"></i>Web oficial</a>
  </div>

  <div class="row g-3" id="gridCiudades"></div>
  <div class="alert alert-light border small mt-4">
    <b>Datos:</b> GitHub Actions scrapea la web oficial cada 5 min. Si tu PC detecta un cambio, te manda un aviso de escritorio.
  </div>
</div>

<script>
let CONCIERTOS = [];
let HISTORIAL = [];
let FILTRO = 'todos';

const EST_TXT = {en_venta:['A LA VENTA','badge-venta'], agotado:['AGOTADO','badge-agotado'], proximamente:['PRÓX. VENTA','badge-prox']};
const MESES = {JAN:'ene',FEB:'feb',MAR:'mar',APR:'abr',MAY:'may',JUN:'jun',JUL:'jul',AUG:'ago',SEP:'sep',OCT:'oct',NOV:'nov',DEC:'dic'};
const MESES_N = {JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};

function ordenFecha(f){const p=f.split(' ');if(p.length===3)return(+p[2])*10000+(MESES_N[p[1]]||1)*100+(+p[0]);if(p.length===2)return(+p[1])*10000+(MESES_N[p[0]]||1)*100;return 99999999;}
function fechaBonita(f){const p=f.split(' ');if(p.length===3)return`${+p[0]} ${MESES[p[1]]||p[1]} ${p[2]}`;if(p.length===2)return`${MESES[p[0]]||p[0]} ${p[1]}`;return f;}
function horaLocal(iso){
  try{
    const d=new Date(iso);
    return d.toLocaleString('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  }catch(e){return iso;}
}

async function cargar(){
  document.getElementById('badge-update').textContent='cargando...';
  try{
    const r=await fetch('estado.json?t='+Date.now());
    const d=await r.json();
    CONCIERTOS=Object.values(d.conciertos||{});
    HISTORIAL=d.historial||[];
    document.getElementById('badge-update').textContent='act. '+horaLocal(d.actualizado);
    renderHistorial();render();
  }catch(e){
    document.getElementById('historialBox').innerHTML='<span class="text-danger small">Error cargando datos: '+e+'</span>';
    document.getElementById('badge-update').textContent='error';
  }
}

function renderHistorial(){
  const box=document.getElementById('historialBox');
  if(!HISTORIAL.length){box.innerHTML='<span class="text-muted small">Sin cambios registrados todavía (está todo como la última vez que se vio).</span>';return;}
  box.innerHTML=HISTORIAL.map(h=>{
    const evs=h.eventos.map(e=>{
      let icon='fa-circle-info',color='#0d6efd';
      if(e.includes('[nueva_ciudad]')||e.includes('[nuevo_concierto]')){icon='fa-star';color='#16a34a';}
      else if(e.includes('[agotado]')){icon='fa-ban';color='#dc2626';}
      else if(e.includes('[liberado]')){icon='fa-unlock';color='#f59e0b';}
      else if(e.includes('[retirado]')){icon='fa-trash';color='#6b7280';}
      const txt=e.replace(/^\[[a-z_]+\]\s*/i,'');
      return `<div class="d-flex align-items-start gap-2 mb-1"><i class="fa-solid ${icon} mt-1" style="color:${color};font-size:.75rem"></i><span>${txt}</span></div>`;
    }).join('');
    return `<div class="cambio-item rounded p-2 mb-2"><div class="small text-muted mb-1"><i class="fa-regular fa-clock me-1"></i>${horaLocal(h.cuando)} · ${h.eventos.length} cambio(s)</div>${evs}</div>`;
  }).join('');
}

function render(){
  const venta=CONCIERTOS.filter(c=>c.estado==='en_venta').length;
  const agot=CONCIERTOS.filter(c=>c.estado==='agotado').length;
  document.getElementById('kpiCiudades').textContent=new Set(CONCIERTOS.map(c=>c.ciudad)).size;
  document.getElementById('kpiTotal').textContent=CONCIERTOS.length;
  document.getElementById('kpiVenta').textContent=venta;
  document.getElementById('kpiAgotado').textContent=agot;

  const ciudades={};
  for(const c of CONCIERTOS){
    if(FILTRO!=='todos'&&c.estado!==FILTRO)continue;
    const k=c.ciudad+'|'+c.pais;
    (ciudades[k]=ciudades[k]||{pais:c.pais,ciudad:c.ciudad,sede:c.sede,items:[]}).items.push(c);
  }
  document.getElementById('gridCiudades').innerHTML=Object.values(ciudades).sort((a,b)=>a.ciudad.localeCompare(b.ciudad)).map(ci=>{
    const filas=ci.items.sort((a,b)=>(ordenFecha(a.fecha)-ordenFecha(b.fecha))||a.hora.localeCompare(b.hora)).map(c=>{
      const [txt,cls]=EST_TXT[c.estado]||[c.estado,'badge-light'];
      const link=c.enlace?`<a href="${c.enlace}" target="_blank" class="small text-decoration-none"><i class="fa-solid fa-up-right-from-square"></i></a>`:'';
      return `<div class="fila-fecha py-2 d-flex justify-content-between align-items-center gap-2"><div><b>${fechaBonita(c.fecha)}</b> <span class="text-muted">${c.hora}</span><div class="small text-muted">${c.orquesta}</div></div><div class="text-end"><span class="badge ${cls}">${txt}</span> ${link}</div></div>`;
    }).join('');
    return `<div class="col-md-6 col-xl-4"><div class="city-card p-3 h-100"><div class="d-flex justify-content-between align-items-start mb-2"><div><h5 class="mb-0">${ci.ciudad}</h5><small class="text-muted">${ci.pais} · ${ci.sede}</small></div><span class="badge bg-light text-dark border">${ci.items.length}</span></div>${filas}</div></div>`;
  }).join('')||'<div class="col-12"><div class="alert alert-light border">Sin conciertos con ese filtro.</div></div>';
}

document.querySelectorAll('.filtro').forEach(b=>b.onclick=()=>{FILTRO=b.dataset.f;document.querySelectorAll('.filtro').forEach(x=>{x.classList.remove('btn-dark');x.classList.add('btn-outline-dark')});b.classList.add('btn-dark');b.classList.remove('btn-outline-dark');render();});
document.getElementById('btnRefresh').onclick=()=>cargar();
cargar();
setInterval(()=>cargar(),300000);
</script>
</body>
</html>
