name: Zelda monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -q requests beautifulsoup4 lxml

      - name: Scrape y diff
        id: sync
        run: python sync.py

      - name: Commit si hay cambios
        run: |
          if [ -n "$(git status --porcelain estado.json)" ]; then
            git config user.name "zelda-monitor"
            git config user.email "jgalvez87@users.noreply.github.com"
            git add estado.json
            git commit -m "cambios $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "sin cambios, nada que commitear"
          fi
